name: Validate and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python tools/validate_repo.py
      - name: Compile Python
        run: python -m compileall -q tools
      - name: Test prompt release tooling
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Build distribution archives
        run: python tools/build_packages.py
      - name: Upload installable archives
        uses: actions/upload-artifact@v4
        with:
          name: xiaowai-photo-poetic-postcard-packages
          path: dist/*.zip
